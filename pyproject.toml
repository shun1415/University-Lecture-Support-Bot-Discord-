[project]
name = "university-lecture-discord-bot"
version = "0.1.0"
description = "A Discord bot that answers student questions based on university lecture data using RAG with OpenAI GPT-4o-mini."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.6.4",
    "icalendar>=6.3.1",
    "nest-asyncio>=1.6.0",
    "openai>=2.6.0",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]
